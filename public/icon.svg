<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="100%" stop-color="#121526"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2ea"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2ea" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Frame -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="6"/>
  <rect x="32" y="32" width="448" height="448" rx="96" fill="none" stroke="url(#glowGrad)" stroke-width="4"/>
  
  <!-- Glowing Background Disc -->
  <circle cx="256" cy="256" r="160" fill="url(#iconGrad)" opacity="0.15" filter="url(#glow)"/>
  
  <!-- Downward Arrow & Lightning Concept -->
  <g filter="url(#glow)">
    <!-- Arrow Head & Shaft -->
    <path d="M256 100 V 290 M 170 215 L 256 300 L 342 215" fill="none" stroke="url(#iconGrad)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Speed Traces -->
    <path d="M 140 370 H 372" fill="none" stroke="url(#iconGrad)" stroke-width="36" stroke-linecap="round"/>
    <path d="M 190 425 H 322" fill="none" stroke="#10b981" stroke-width="28" stroke-linecap="round"/>
  </g>
</svg>
